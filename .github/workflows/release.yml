name: Release

on:
  push:
    branches:
      - main

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    # Prevent release job from running on the automated changelog/version bump
    # commits that semantic-release itself pushes (they contain [skip ci])
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    permissions:
      contents: write       # push tags and the release commit
      issues: write         # comment on resolved issues
      pull-requests: write  # comment on merged PRs

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history is required for semantic-release to compute the next version
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The release commit's body/footer (full changelog notes with commit
          # links) routinely exceeds commitlint's line-length rules; skip
          # husky's commit-msg hook for this machine-generated commit only.
          HUSKY: 0
        run: npx semantic-release
